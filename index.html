  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"5d5708b0-e0a8-4328-8582-dbcdc6d5fba5\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\"><meta name=\"design_doc_mode\" content=\"canvas\"><style>body{margin:0;background:#e6e3ea;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{color:#7f3d97}a:hover{color:#361e54}<\u002Fstyle><\u002Fhelmet>\n\n<div style=\"padding:56px 60px 80px;display:flex;flex-direction:column;gap:18px\">\n<div style=\"display:flex;align-items:baseline;gap:14px\">\n\n\n\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap\">\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font:12px/1.3 Arial;color:#717375\">Desktop&nbsp;<\u002Fdiv>\n<div style=\"width:1440px;background:#fff;border:1px solid rgba(54,30,84,.16);border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(54,30,84,.1)\">\n\n<div style=\"background:#361e54;padding:52px 88px 0;position:relative;overflow:hidden\">\n<div style=\"position:absolute;top:0;right:0;display:flex;height:8px;width:520px\"><i style=\"flex:1;background:#4d9d47\"><\u002Fi><i style=\"flex:1;background:#1d84c3\"><\u002Fi><i style=\"flex:1;background:#7f3d97\"><\u002Fi><i style=\"flex:1;background:#f37321\"><\u002Fi><i style=\"flex:1;background:#b80667\"><\u002Fi><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center;font:12px/1 Arial;color:rgba(255,255,255,.62);margin-bottom:34px\"><span>Keeping safe information<\u002Fspan><span>›<\u002Fspan><span style=\"color:#fff\">Safe Places Scheme<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 420px;gap:56px;align-items:center;padding-bottom:64px\">\n<div>\n<h1 style=\"font:700 54px/1.08 Arial;color:#fff;margin:0 0 22px;letter-spacing:-.02em;text-wrap:balance\">Give someone somewhere safe to turn<\u002Fh1>\n<p style=\"font:400 19px/1.55 Arial;color:rgba(255,255,255,.86);margin:0 0 34px;max-width:600px;text-wrap:pretty\">A Safe Place is a business or service where someone who feels lost, scared or unwell while out in the community can go for help.<\u002Fp>\n<div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n<a href=\"#join\" style=\"display:inline-block;background:#b80667;color:#fff;font:700 17px/1 Arial;padding:19px 30px;border-radius:5px;text-decoration:none\" style-hover=\"background:#9c0557;color:#fff\">Join the Safe Places Scheme<\u002Fa>\n<a href=\"#steps\" style=\"display:inline-block;color:#fff;font:700 16px/1 Arial;padding:19px 22px;border:2px solid rgba(255,255,255,.4);border-radius:5px;text-decoration:none\" style-hover=\"border-color:#fff;color:#fff\">See what's involved<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:18px;align-items:center;justify-content:center\">\n<img src=\"19621518-524d-4c34-9d52-084f5f68651c\" alt=\"Safe Place\" style=\"width:230px;height:230px;object-fit:contain;display:block\">\n<img src=\"eb095303-9438-4f0c-9e91-d14e08871fb4\" alt=\"People First Forum\" style=\"width:150px;height:auto;object-fit:contain;display:block;background:#fff;border-radius:6px;padding:10px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#f7f5f9;padding:26px 88px;display:flex;gap:56px;align-items:center;border-bottom:1px solid rgba(54,30,84,.1)\">\n<div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:700 42px/1 Arial;color:#4d9d47\">{{ memberCount }}<\u002Fspan><span style=\"font:15px/1.3 Arial;color:#361e54;max-width:150px\">Safe Places across BCP&nbsp;<\u002Fspan><\u002Fdiv>\n<i style=\"width:1px;height:44px;background:rgba(54,30,84,.14)\"><\u002Fi>\n<div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:700 42px/1 Arial;color:#1d84c3\">£0<\u002Fspan><span style=\"font:15px/1.3 Arial;color:#361e54;max-width:150px\">Cost to join or stay a member<\u002Fspan><\u002Fdiv>\n<i style=\"width:1px;height:44px;background:rgba(54,30,84,.14)\"><\u002Fi>\n<div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:700 42px/1 Arial;color:#f37321\">1<\u002Fspan><span style=\"font:15px/1.3 Arial;color:#361e54;max-width:180px\">Annual check-in<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:76px 88px 0\">\n<h2 style=\"font:700 34px/1.15 Arial;color:#361e54;margin:0 0 12px;letter-spacing:-.01em\">What happens when someone needs a Safe Place<\u002Fh2>\n\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px\">\n<div style=\"border-top:5px solid #4d9d47;background:#f7f5f9;padding:26px 24px 30px;border-radius:0 0 6px 6px\">\n<div style=\"font:700 13px/1 Arial;color:#4d9d47;margin-bottom:14px\">STEP 1<\u002Fdiv>\n<h3 style=\"font:700 19px/1.3 Arial;color:#361e54;margin:0 0 10px\">Welcome them in<\u002Fh3>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0\">Offer a seat somewhere quiet and safe. Let them stay until they feel ready to leave.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top:5px solid #1d84c3;background:#f7f5f9;padding:26px 24px 30px;border-radius:0 0 6px 6px\">\n<div style=\"font:700 13px/1 Arial;color:#1d84c3;margin-bottom:14px\">STEP 2<\u002Fdiv>\n<h3 style=\"font:700 19px/1.3 Arial;color:#361e54;margin:0 0 10px\">Look for a Keeping Safe card<\u002Fh3>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0\">Many people carry one. It lists people to ring on the back — a family member, carer or support worker.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top:5px solid #f37321;background:#f7f5f9;padding:26px 24px 30px;border-radius:0 0 6px 6px\">\n<div style=\"font:700 13px/1 Arial;color:#f37321;margin-bottom:14px\">STEP 3<\u002Fdiv>\n<h3 style=\"font:700 19px/1.3 Arial;color:#361e54;margin:0 0 10px\">Make the call<\u002Fh3>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0\">Ring the named contact and let the person speak to them if they want to.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top:5px solid #b80667;background:#f7f5f9;padding:26px 24px 30px;border-radius:0 0 6px 6px\">\n<div style=\"font:700 13px/1 Arial;color:#b80667;margin-bottom:14px\">STEP 4<\u002Fdiv>\n<h3 style=\"font:700 19px/1.3 Arial;color:#361e54;margin:0 0 10px\">Call 999 if needed<\u002Fh3>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0\">If they have been a victim of crime or need medical help, contact the emergency services.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:70px 88px 0\">\n<div style=\"background:#361e54;border-radius:8px;padding:56px 64px;display:grid;grid-template-columns:1fr 320px;gap:64px;align-items:center\">\n<div>\n<div style=\"font:700 60px/1 Arial;color:#f37321;margin-bottom:22px\">“<\u002Fdiv>\n<p style=\"font:400 27px/1.45 Arial;color:#fff;margin:0 0 22px;text-wrap:pretty\">Safe places are useful because they make me feel confident and safe when I am out in the community and it helps me to go to one of the shops with the Safe Places sticker in case I have a problem.<\u002Fp>\n<div style=\"font:14px/1.4 Arial;color:rgba(255,255,255,.55)\">A Safe Places user<\u002Fdiv>\n<\u002Fdiv>\n<img src=\"b7f28eae-ed71-4fc9-a059-c44971693039\" alt=\"People First Forum members at a community event in Christchurch\" style=\"width:100%;height:260px;object-fit:cover;border-radius:6px;display:block\">\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"steps\" style=\"padding:80px 88px 0\">\n<h2 style=\"font:700 34px/1.15 Arial;color:#361e54;margin:0 0 12px;letter-spacing:-.01em\">Joining takes five steps<\u002Fh2>\n\n<div style=\"display:flex;gap:0;align-items:stretch\">\n<sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"flex:1;padding:0 0 0 0;display:flex;flex-direction:column\">\n<div style=\"height:7px;background:{{ s.colour }}\"><\u002Fdiv>\n<div style=\"padding:26px 26px 34px 0;margin-right:26px;border-right:1px solid rgba(54,30,84,.12);flex:1\">\n<div style=\"width:38px;height:38px;border-radius:50%;background:{{ s.colour }};color:#fff;font:700 18px/38px Arial;text-align:center;margin-bottom:18px\">{{ s.n }}<\u002Fdiv>\n<h3 style=\"font:700 20px/1.25 Arial;color:#361e54;margin:0 0 10px\">{{ s.title }}<\u002Fh3>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0 0 14px\">{{ s.body }}<\u002Fp>\n<div style=\"font:700 13px/1.3 Arial;color:#717375\">{{ s.meta }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div id=\"join\" style=\"margin-top:44px;display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n<a href=\"#join\" style=\"display:inline-block;background:#b80667;color:#fff;font:700 17px/1 Arial;padding:19px 30px;border-radius:5px;text-decoration:none\" style-hover=\"background:#9c0557;color:#fff\">Start your application<\u002Fa>\n<a href=\"#resources\" style=\"font:16px/1 Arial;color:#7f3d97;text-decoration:underline\" style-hover=\"color:#361e54\">Read the full terms and conditions first<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:80px 88px 0\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start\">\n<div>\n<h2 style=\"font:700 34px/1.15 Arial;color:#361e54;margin:0 0 12px;letter-spacing:-.01em\">{{ memberCount }} Safe Places, and counting<\u002Fh2>\n<p style=\"font:17px/1.6 Arial;color:#5a5560;margin:0 0 26px;text-wrap:pretty\">Libraries, cafés, pharmacies, leisure centres, RNLI stations, shopping centres and pubs across Bournemouth, Christchurch and Poole. Search the directory to find your nearest — or check whether your street already has one.<\u002Fp>\n<div style=\"display:flex;gap:0;margin-bottom:14px;border:2px solid #361e54;border-radius:5px;overflow:hidden;max-width:440px\">\n<div style=\"flex:1;padding:15px 16px;font:16px/1 Arial;color:#9a95a1\">Postcode or business name<\u002Fdiv>\n<div style=\"background:#361e54;color:#fff;font:700 15px/1 Arial;padding:15px 22px\">Search<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px\">\n<span style=\"font:13px/1 Arial;color:#361e54;border:1px solid rgba(54,30,84,.25);border-radius:14px;padding:8px 14px\">All 164<\u002Fspan>\n<span style=\"font:13px/1 Arial;color:#5a5560;border:1px solid rgba(54,30,84,.15);border-radius:14px;padding:8px 14px\">Bournemouth<\u002Fspan>\n<span style=\"font:13px/1 Arial;color:#5a5560;border:1px solid rgba(54,30,84,.15);border-radius:14px;padding:8px 14px\">Christchurch<\u002Fspan>\n<span style=\"font:13px/1 Arial;color:#5a5560;border:1px solid rgba(54,30,84,.15);border-radius:14px;padding:8px 14px\">Poole<\u002Fspan>\n<span style=\"font:13px/1 Arial;color:#5a5560;border:1px solid rgba(54,30,84,.15);border-radius:14px;padding:8px 14px\">Open now<\u002Fspan>\n<\u002Fdiv>\n<img src=\"8da7e756-3a26-42a5-8085-b279782ba6d1\" alt=\"Map of BCP showing clustered Safe Places locations\" style=\"width: 610px; height: 433px; object-fit: cover; object-position: center; border-radius: 6px; border: 1px solid rgba(54,30,84,.14); display: block\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(54,30,84,.14)\">\n<sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"6\">\n\n<\u002Fsc-for>\n\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<div style=\"padding: 80px 88px 0; width: 1259px; height: 313px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n<div style=\"background:#f7f5f9;border-radius:8px;padding:40px 40px 44px;border-left:7px solid #1d84c3\">\n<h3 style=\"font:700 24px/1.25 Arial;color:#361e54;margin:0 0 12px\">The national Safe Places network<\u002Fh3>\n<p style=\"font:16px/1.6 Arial;color:#5a5560;margin:0 0 22px\">BCP is one member scheme within a UK-wide network. The national site holds the full information pack, learning materials, Mate Crime resources and the Safe Places app for finding your nearest Safe Place on a phone.<\u002Fp>\n<a href=\"https://www.safeplaces.org.uk/\" style=\"font:700 16px/1 Arial;color:#1d84c3;text-decoration:underline\" style-hover=\"color:#361e54\">Visit safeplaces.org.uk →<\u002Fa>\n<\u002Fdiv>\n<div style=\"background:#f7f5f9;border-radius:8px;padding:40px 40px 44px;border-left:7px solid #b80667\">\n<h3 style=\"font:700 24px/1.25 Arial;color:#361e54;margin:0 0 12px\">Talk to People First Forum<\u002Fh3>\n<p style=\"font:16px/1.6 Arial;color:#5a5560;margin:0 0 22px\">People First Forum run the Safe Places Scheme across BCP. They handle training, stickers, your annual check-in and withdrawing from the scheme.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:8px;font:16px/1.5 Arial;color:#361e54\">\n<div><strong style=\"font-weight:700\">Phone<\u002Fstrong> 01202 051014<\u002Fdiv>\n<div><strong style=\"font-weight:700\">Email<\u002Fstrong> <a href=\"mailto:office.admin1@peoplefirstforum.co.uk\" style=\"color:#b80667\">office.admin1@peoplefirstforum.co.uk<\u002Fa><\u002Fdiv>\n<div><strong style=\"font-weight:700\">Post<\u002Fstrong> Rossmore Leisure Centre, Herbert Avenue, Poole, BH12 4HR<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font:12px/1.3 Arial;color:#717375\">Mobile&nbsp;<\u002Fdiv>\n<div style=\"width: 392px; background: #fff; border: 1px solid rgba(54,30,84,.16); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 10px rgba(54,30,84,.1); height: 2927px\">\n<div style=\"background:#361e54;padding:22px 22px 34px;position:relative;overflow:hidden\">\n<div style=\"position:absolute;top:0;right:0;display:flex;height:6px;width:220px\"><i style=\"flex:1;background:#4d9d47\"><\u002Fi><i style=\"flex:1;background:#1d84c3\"><\u002Fi><i style=\"flex:1;background:#7f3d97\"><\u002Fi><i style=\"flex:1;background:#f37321\"><\u002Fi><i style=\"flex:1;background:#b80667\"><\u002Fi><\u002Fdiv>\n<div style=\"font:11px/1 Arial;color:rgba(255,255,255,.6);margin:14px 0 20px\">Keeping safe information › Safe Places<\u002Fdiv>\n<div style=\"display:flex;gap:12px;align- /1.3 Arial;color:#361e54;margin-bottom:5px\">1 · Welcome them in<\u002Fdiv><p style=\"font:14px/1.5 Arial;color:#5a5560;margin:0\">Somewhere quiet and safe to wait.<\u002Fp><\u002Fdiv>\n<div style=\"border-left:5px solid #1d84c3;background:#f7f5f9;padding:16px 18px\"><div style=\"font:700 16px/1.3 Arial;color:#361e54;margin-bottom:5px\">2 · Look for a Keeping Safe card<\u002Fdiv><p style=\"font:14px/1.5 Arial;color:#5a5560;margin:0\">Contacts are listed on the back.<\u002Fp><\u002Fdiv>\n<div style=\"border-left:5px solid #f37321;background:#f7f5f9;padding:16px 18px\"><div style=\"font:700 16px/1.3 Arial;color:#361e54;margin-bottom:5px\">3 · Make the call<\u002Fdiv><p style=\"font:14px/1.5 Arial;color:#5a5560;margin:0\">Let them speak to their contact.<\u002Fp><\u002Fdiv>\n<div style=\"border-left:5px solid #b80667;background:#f7f5f9;padding:16px 18px\"><div style=\"font:700 16px/1.3 Arial;color:#361e54;margin-bottom:5px\">4 · Call 999 if needed<\u002Fdiv><p style=\"font:14px/1.5 Arial;color:#5a5560;margin:0\">For crime or medical help.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:34px 22px 0\">\n<div style=\"background:#361e54;border-radius:6px;padding:26px 24px\">\n<div style=\"font:700 40px/1 Arial;color:#f37321;margin-bottom:10px\">“<\u002Fdiv>\n<img src=\"b7f28eae-ed71-4fc9-a059-c44971693039\" alt=\"People First Forum members at a community event\" style=\"width:100%;height:170px;object-fit:cover;border-radius:5px;display:block;margin-bottom:18px\"><p style=\"font:18px/1.45 Arial;color:#fff;margin:0 0 14px\">Safe places are useful because they make me feel confident and safe when I am out in the community and it helps me to go to one of the shops with the Safe Places sticker in case I have a problem.<\u002Fp>\n<div style=\"font:12px/1.4 Arial;color:rgba(255,255,255,.55)\">A Safe Places user<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:34px 22px 0\">\n<h2 style=\"font:700 25px/1.2 Arial;color:#361e54;margin:0 0 18px\">Joining takes five steps<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:0\">\n<sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:20px\">\n<div style=\"width:34px;height:34px;border-radius:50%;background:{{ s.colour }};color:#fff;font:700 16px/34px Arial;text-align:center\">{{ s.n }}<\u002Fdiv>\n<div><div style=\"font:700 17px/1.3 Arial;color:#361e54;margin-bottom:4px\">{{ s.title }}<\u002Fdiv><p style=\"font:14px/1.5 Arial;color:#5a5560;margin:0\">{{ s.body }}<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<a href=\"#join\" style=\"display:block;background:#b80667;color:#fff;font:700 17px/1 Arial;padding:19px 20px;border-radius:5px;text-decoration:none;text-align:center\" style-hover=\"background:#9c0557;color:#fff\">Start your application<\u002Fa>\n<\u002Fdiv>\n<div style=\"padding:34px 22px 0\">\n<h2 style=\"font:700 25px/1.2 Arial;color:#361e54;margin:0 0 8px\">Find a Safe Place<\u002Fh2>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0 0 16px\">{{ memberCount }} across Bournemouth, Christchurch and Poole.<\u002Fp>\n<div style=\"display:flex;border:2px solid #361e54;border-radius:5px;overflow:hidden;margin-bottom:14px\"><div style=\"flex:1;padding:14px;font:15px/1 Arial;color:#9a95a1\">Postcode<\u002Fdiv><div style=\"background:#361e54;color:#fff;font:700 14px/1 Arial;padding:14px 18px\">Search<\u002Fdiv><\u002Fdiv>\n<img src=\"8da7e756-3a26-42a5-8085-b279782ba6d1\" alt=\"Map of BCP showing clustered Safe Places locations\" style=\"width:100%;height:200px;object-fit:cover;object-position:center;border-radius:6px;border:1px solid rgba(54,30,84,.14);display:block\">\n<\u002Fdiv>\n\n<div style=\"padding:34px 22px 0\">\n<div style=\"background:#f7f5f9;border-left:5px solid #1d84c3;padding:22px 20px;margin-bottom:12px\">\n<h3 style=\"font:700 19px/1.25 Arial;color:#361e54;margin:0 0 8px\">National Safe Places network<\u002Fh3>\n<p style=\"font:15px/1.55 Arial;color:#5a5560;margin:0 0 14px\">Information pack, learning materials and the Safe Places app.<\u002Fp>\n<a href=\"https://www.safeplaces.org.uk/\" style=\"font:700 15px/1 Arial;color:#1d84c3;text-decoration:underline\">Visit safeplaces.org.uk →<\u002Fa>\n<\u002Fdiv>\n<div style=\"background:#f7f5f9;border-left:5px solid #b80667;padding:22px 20px\">\n<h3 style=\"font:700 19px/1.25 Arial;color:#361e54;margin:0 0 10px\">People First Forum<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:6px;font:15px/1.5 Arial;color:#361e54\">\n<div>01202 051014<\u002Fdiv>\n<div><a href=\"mailto:office.admin1@peoplefirstforum.co.uk\" style=\"color:#b80667;word-break:break-all\">office.admin1@peoplefirstforum.co.uk<\u002Fa><\u002Fdiv>\n<div>Rossmore Leisure Centre, Herbert Avenue, Poole, BH12 4HR<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;memberCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:164,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:500,&quot;section&quot;:&quot;Content&quot;},&quot;stepColourMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;By meaning&quot;,&quot;options&quot;:[&quot;By meaning&quot;,&quot;Cool to warm&quot;,&quot;Single accent&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const P = { green:'#4d9d47', blue:'#1d84c3', purple:'#7f3d97', orange:'#f37321', pink:'#b80667' };\n    const mode = this.props.stepColourMode ?? 'By meaning';\n    const order = mode === 'Cool to warm'\n      ? [P.purple, P.blue, P.green, P.orange, P.pink]\n      : mode === 'Single accent'\n      ? ['#361e54','#361e54','#361e54','#361e54','#361e54']\n      : [P.green, P.blue, P.purple, P.orange, P.pink];\n    const copy = [\n      ['Check you can take part','Three quick questions: open to the public, at least two staff on site, and public liability insurance.','About 1 minute'],\n      ['Tell us about your business','Name, address, phone, email, type of business and your opening hours.','About 4 minutes'],\n      ['Agree the terms','A short summary of what you are committing to, with the full terms underneath.','About 3 minutes'],\n      ['Photo and social media consent','Optional. Choose where, if anywhere, we can share photos and quotes about your Safe Place.','About 1 minute'],\n      ['Sign and send','Type your name to sign. You get a copy by email straight away.','Under 1 minute']\n    ];\n    const steps = copy.map((c, i) => ({ n: i + 1, colour: order[i], title: c[0], body: c[1], meta: c[2] }));\n\n    const members = [\n      ['Boscombe Library','Hawkwood Road, Boscombe, BH5 1PU','Mon–Sat, 9am–5pm','Library'],\n      ['Caffè Nero','Old Christchurch Road, Bournemouth, BH1 1EH','Daily, 7am–7pm','Café'],\n      ['Dolphin Shopping Centre','Falkland Square, Poole, BH15 1SZ','Mon–Sat, 9am–5.30pm','Shopping centre'],\n      ['RNLI Sandbanks Beach','Banks Road, Poole, BH13 7QQ','Daily, 10am–6pm (seasonal)','Lifeguard station'],\n      ['Christchurch Library','Druitt Gardens, Christchurch, BH23 1BD','Mon–Sat, 9am–5pm','Library'],\n      ['Lighthouse, Poole’s Centre for the Arts','Kingland Road, Poole, BH15 1UG','Daily, 9.30am–8pm','Arts centre'],\n      ['Bryant Pharmacy','Bournemouth','Mon–Fri, 9am–6pm','Pharmacy'],\n      ['The Moon in the Square','Exeter Road, Bournemouth, BH2 5AQ','Daily, 8am–11pm','Pub'],\n      ['Rossmore Leisure Centre','Herbert Avenue, Poole, BH12 4HR','Mon–Sun, 7am–9pm','Leisure centre']\n    ].map(m => ({ name:m[0], address:m[1], hours:m[2], type:m[3] }));\n\n    const docs = [\n      ['Terms and conditions','What a Safe Place agrees to provide, and what you need in place before you can join.','PDF, 2 pages', P.purple],\n      ['Photo and social media consent form','Where we may share photos, video and quotes — and how to withdraw consent later.','PDF, 1 page', P.orange],\n      ['Privacy policy','What information People First Forum hold, why, how it is kept safe and your rights.','PDF, 1 page', P.blue],\n      ['Welcome letter','The letter you receive once you have joined, explaining the annual check-in.','PDF, 1 page', P.green],\n      ['Blank joining form','Prefer paper? Print this, sign it and post or email it to People First Forum.','PDF, 2 pages', P.pink]\n    ].map(d => ({ title:d[0], body:d[1], meta:d[2], colour:d[3] }));\n\n    return { memberCount: this.props.memberCount ?? 164, steps, members, docs };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
